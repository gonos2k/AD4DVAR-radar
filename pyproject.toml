[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "advar-radar-nowcast"
version = "0.63.0"
description = "A matrix-free three-frame variational radar nowcast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "numpy>=1.24",
    "torch>=2.1",
]

[project.scripts]
advar-nowcast = "advar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
