[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advar-radar-nowcast"
version = "0.107.0"
description = "A matrix-free three-frame variational radar nowcast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.0",
    "filelock>=3.20.3",
    "numpy>=1.24",
    "torch>=2.13.0",
]

[project.scripts]
advar-nowcast = "advar.cli:main"
advar-mps-certify = "advar.mps_certification:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
advar = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
