name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} CPU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            lock_file: requirements/ci-py310-linux.lock
          - python-version: "3.12"
            lock_file: requirements/ci-py312-linux.lock

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock_file }}

      - name: Install the hashed Linux CPU closure
        run: |
          python -I -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --requirement "${{ matrix.lock_file }}"

      - name: Verify and audit the locked closure in isolation
        working-directory: ${{ runner.temp }}
        env:
          LOCK_FILE: ${{ github.workspace }}/${{ matrix.lock_file }}
        run: |
          printf '%s\n' 'raise SystemExit("repository module shadowed pip-audit")' > pip_audit.py
          python -I - <<'PY'
          import site
          from pathlib import Path

          import pip_audit
          import torch

          module = Path(pip_audit.__file__).resolve()
          roots = tuple(Path(item).resolve() for item in site.getsitepackages())
          assert any(root == module or root in module.parents for root in roots)
          assert torch.version.cuda is None
          PY
          python -I "$GITHUB_WORKSPACE/.github/scripts/check_dependency_locks.py"
          python -I -m pip_audit \
            --strict \
            --disable-pip \
            --no-deps \
            --requirement "$LOCK_FILE"

      - name: Install the candidate package without resolving dependencies
        run: |
          python -I -m pip install \
            --no-build-isolation \
            --no-deps \
            --editable .
          python -I -m pip check

      - name: Check product source types
        if: matrix.python-version == '3.12'
        run: python -I .github/scripts/check_basedpyright.py

      - name: Run CPU FP32 and FP64 tests
        run: python -I -m pytest -q

  package:
    name: Wheel and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/ci-py312-linux.lock
            requirements/runtime-py312-linux.lock

      - name: Install the hashed build closure
        run: |
          python -I -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --requirement requirements/ci-py312-linux.lock

      - name: Verify and audit build and runtime closures in isolation
        working-directory: ${{ runner.temp }}
        run: |
          printf '%s\n' 'raise SystemExit("repository module shadowed pip-audit")' > pip_audit.py
          python -I - <<'PY'
          import site
          from pathlib import Path

          import pip_audit
          import torch

          module = Path(pip_audit.__file__).resolve()
          roots = tuple(Path(item).resolve() for item in site.getsitepackages())
          assert any(root == module or root in module.parents for root in roots)
          assert torch.version.cuda is None
          PY
          python -I "$GITHUB_WORKSPACE/.github/scripts/check_dependency_locks.py"
          python -I -m pip_audit \
            --strict \
            --disable-pip \
            --no-deps \
            --requirement "$GITHUB_WORKSPACE/requirements/ci-py312-linux.lock"
          python -I -m pip_audit \
            --strict \
            --disable-pip \
            --no-deps \
            --format json \
            --output "$RUNNER_TEMP/runtime-audit.json" \
            --requirement "$GITHUB_WORKSPACE/requirements/runtime-py312-linux.lock"

      - name: Build source and wheel distributions
        run: python -I -m build --no-isolation

      - name: Materialize the exact Linux CPU wheelhouse
        run: |
          mkdir "$RUNNER_TEMP/runtime-wheelhouse"
          python -I -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --requirement requirements/runtime-py312-linux.lock \
            --dest "$RUNNER_TEMP/runtime-wheelhouse"

      - name: Install the built wheel offline in isolation
        run: |
          python -I -m venv --without-pip .wheel-venv
          python -I -m pip --python .wheel-venv/bin/python install \
            --no-index \
            --find-links "$RUNNER_TEMP/runtime-wheelhouse" \
            --require-hashes \
            --only-binary=:all: \
            --no-compile \
            --requirement requirements/runtime-py312-linux.lock
          python -I -m pip --python .wheel-venv/bin/python install \
            --no-index --no-deps --no-compile dist/*.whl
          python -I -m pip --python .wheel-venv/bin/python check
          find .wheel-venv -type f \
            \( -name '*.pyc' -o -name '*.pyo' \) -delete
          .wheel-venv/bin/python -I -B - <<'PY'
          import torch

          assert torch.version.cuda is None
          PY

      - name: Generate CLI smoke input
        run: |
          .wheel-venv/bin/python -I -B - <<'PY'
          import os
          from pathlib import Path

          import numpy as np

          output = Path(os.environ["RUNNER_TEMP"])
          y, x = np.meshgrid(
              np.arange(16, dtype=np.float32),
              np.arange(16, dtype=np.float32),
              indexing="ij",
          )
          frame = -10.0 + 45.0 * np.exp(
              -((y - 7.5) ** 2 + (x - 7.5) ** 2) / 12.0
          )
          np.save(output / "three_frames.npy", np.stack((frame, frame, frame)))
          PY

      - name: Run installed CLI
        run: |
          .wheel-venv/bin/advar-nowcast \
            "$RUNNER_TEMP/three_frames.npy" \
            "$RUNNER_TEMP/forecast.npz"

      - name: Validate installed CLI output contract
        run: |
          .wheel-venv/bin/python -I -B - <<'PY'
          import os
          from pathlib import Path

          import numpy as np

          path = Path(os.environ["RUNNER_TEMP"]) / "forecast.npz"
          with np.load(path, allow_pickle=False) as result:
              assert result["output_contract_version"].item() == "nowcast-npz-v73"
              assert result["forecast_run_artifact_version"].item() == "forecast-run-v67"
              assert result["operational_runtime_profile_digest"].item() == ""
              assert not result["operational_calibration_manifest_present"].item()
              assert result["operational_calibration_manifest_json"].item() == ""
              assert result["operational_calibration_manifest_digest"].item() == ""
              assert result["operational_calibration_approval_digest"].item() == ""
              assert not result["operational_data_identity_present"].item()
              assert result["operational_data_identity_json"].item() == ""
              assert result["operational_data_identity_digest"].item() == ""
              assert "state_path_source" in result
              assert "minimum_growth_overlap_support" in result
              assert "verified_source_support" in result
              assert "local_motion_verified_support" in result
              assert "local_growth_verified_support" in result
              assert "local_dynamics_verified_support" in result
              assert "path_verified_source_support" in result
              assert "forecast_path_verified_support" in result
              assert "forecast_verified_support" in result
              assert "forecast_local_motion_verified_support" in result
              assert "forecast_local_growth_verified_support" in result
              assert "forecast_local_dynamics_verified_support" in result
              assert "forecast_confidence" in result
              assert "p1_velocity_saturation_uncertainty_mps" in result
              assert "p1_log_growth_saturation_uncertainty_per_step" in result
              assert "motion_evidence_uncertainty_multiplier" in result
              assert "radar_dynamics_anchored_valid_mask" in result
              assert "forecast_position_uncertainty_m" in result
              assert "forecast_log_growth_uncertainty" in result
              assert "radar_anchored_valid_mask" in result
              assert "background_fallback_mask" in result
              assert "observation_path_mode" in result
              assert "background_path_mode" in result
              assert result["forecast_dbz"].shape == (18, 16, 16)
              assert np.array_equal(
                  np.isfinite(result["forecast_dbz"]),
                  result["valid_mask"],
              )
              assert result["data_status"].item() == "OBSERVED"
          PY

      - name: Generate separate ephemeral candidate-smoke authority keys
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" -I -B - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          for name in ("bundle", "runtime-activation"):
              key = Ed25519PrivateKey.generate()
              private_path = Path(f"candidate-smoke-{name}-key.raw")
              private_path.write_bytes(key.private_bytes_raw())
              private_path.chmod(0o600)
              Path(f"candidate-smoke-{name}-public-key.hex").write_text(
                  key.public_key().public_bytes_raw().hex(),
                  encoding="ascii",
              )
          PY

      - name: Build the signed candidate-smoke deployment bundle
        run: |
          .wheel-venv/bin/python -I -B .github/scripts/build_deployment_bundle.py build \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --lock requirements/runtime-py312-linux.lock \
            --audit "$RUNNER_TEMP/runtime-audit.json" \
            --wheelhouse "$RUNNER_TEMP/runtime-wheelhouse" \
            --output "$RUNNER_TEMP/advar-linux-cpu-candidate-smoke" \
            --source-commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --mode candidate-smoke \
            --signer-id ci-candidate-smoke \
            --signing-private-key \
              "$RUNNER_TEMP/candidate-smoke-bundle-key.raw"

      - name: Verify the candidate-smoke bundle with an external public key
        working-directory: ${{ runner.temp }}
        env:
          ADVAR_SOURCE_COMMIT: ${{ github.sha }}
          ADVAR_REPOSITORY: ${{ github.repository }}
          ADVAR_SOURCE_REF: ${{ github.ref }}
          ADVAR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ADVAR_WORKSPACE: ${{ github.workspace }}
        run: |
          "$ADVAR_WORKSPACE/.wheel-venv/bin/python" -I -B \
            "$ADVAR_WORKSPACE/.github/scripts/build_deployment_bundle.py" verify \
            --bundle advar-linux-cpu-candidate-smoke \
            --trusted-public-key candidate-smoke-bundle-public-key.hex \
            --expected-mode candidate-smoke \
            --expected-repository "$ADVAR_REPOSITORY" \
            --expected-source-ref "$ADVAR_SOURCE_REF" \
            --expected-source-commit "$ADVAR_SOURCE_COMMIT" \
            --expected-workflow-sha "$ADVAR_WORKFLOW_SHA" \
            --expected-signer-id ci-candidate-smoke \
            --verify-installation

      - name: Reproduce the runtime tree in a second offline environment
        working-directory: ${{ runner.temp }}
        env:
          ADVAR_SOURCE_COMMIT: ${{ github.sha }}
          ADVAR_REPOSITORY: ${{ github.repository }}
          ADVAR_SOURCE_REF: ${{ github.ref }}
          ADVAR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ADVAR_WORKSPACE: ${{ github.workspace }}
        run: |
          python -I -m venv --without-pip replay-wheel-venv
          python -I -m pip --python replay-wheel-venv/bin/python install \
            --no-index \
            --find-links runtime-wheelhouse \
            --require-hashes \
            --only-binary=:all: \
            --no-compile \
            --requirement "$ADVAR_WORKSPACE/requirements/runtime-py312-linux.lock"
          python -I -m pip --python replay-wheel-venv/bin/python install \
            --no-index \
            --no-deps \
            --no-compile \
            "$ADVAR_WORKSPACE"/dist/*.whl
          python -I -m pip --python replay-wheel-venv/bin/python check
          find replay-wheel-venv -type f \
            \( -name '*.pyc' -o -name '*.pyo' \) -delete
          replay-wheel-venv/bin/python -I -B \
            "$ADVAR_WORKSPACE/.github/scripts/build_deployment_bundle.py" verify \
            --bundle advar-linux-cpu-candidate-smoke \
            --trusted-public-key candidate-smoke-bundle-public-key.hex \
            --expected-mode candidate-smoke \
            --expected-repository "$ADVAR_REPOSITORY" \
            --expected-source-ref "$ADVAR_SOURCE_REF" \
            --expected-source-commit "$ADVAR_SOURCE_COMMIT" \
            --expected-workflow-sha "$ADVAR_WORKFLOW_SHA" \
            --expected-signer-id ci-candidate-smoke \
            --verify-installation

      - name: Bind the offline runtime tree to an activation receipt
        working-directory: ${{ runner.temp }}
        env:
          ADVAR_SOURCE_COMMIT: ${{ github.sha }}
          ADVAR_REPOSITORY: ${{ github.repository }}
          ADVAR_SOURCE_REF: ${{ github.ref }}
          ADVAR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ADVAR_WORKSPACE: ${{ github.workspace }}
        run: |
          replay-wheel-venv/bin/python -I -B \
            "$ADVAR_WORKSPACE/.github/scripts/build_deployment_bundle.py" \
            activate-runtime \
            --bundle advar-linux-cpu-candidate-smoke \
            --trusted-bundle-public-key candidate-smoke-bundle-public-key.hex \
            --expected-mode candidate-smoke \
            --expected-repository "$ADVAR_REPOSITORY" \
            --expected-source-ref "$ADVAR_SOURCE_REF" \
            --expected-source-commit "$ADVAR_SOURCE_COMMIT" \
            --expected-workflow-sha "$ADVAR_WORKFLOW_SHA" \
            --expected-bundle-signer-id ci-candidate-smoke \
            --deployment-instance-digest \
              aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --host-identity-digest \
              bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --activation-sequence-number 1 \
            --expires-at 2030-01-01T00:00:00Z \
            --activation-authority-id ci-runtime-activation \
            --activation-authority-trust-store-digest \
              cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --activation-signing-private-key \
              candidate-smoke-runtime-activation-key.raw \
            --receipt runtime-activation-receipt.json
          bundle_digest=$(replay-wheel-venv/bin/python -I -B - <<'PY'
          import json
          print(json.load(open("advar-linux-cpu-candidate-smoke/manifest.json"))["bundle_digest"])
          PY
          )
          runtime_digest=$(replay-wheel-venv/bin/python -I -B - <<'PY'
          import json
          print(json.load(open("advar-linux-cpu-candidate-smoke/runtime-tree.json"))["runtime_tree_digest"])
          PY
          )
          interpreter_digest=$(replay-wheel-venv/bin/python -I -B - <<'PY'
          import json
          tree = json.load(open("advar-linux-cpu-candidate-smoke/runtime-tree.json"))
          print(tree["interpreter_closure"]["interpreter_closure_digest"])
          PY
          )
          replay-wheel-venv/bin/python -I -B \
            "$ADVAR_WORKSPACE/.github/scripts/build_deployment_bundle.py" \
            verify-runtime-activation \
            --receipt runtime-activation-receipt.json \
            --trusted-activation-public-key \
              candidate-smoke-runtime-activation-public-key.hex \
            --expected-mode candidate-smoke \
            --expected-deployment-bundle-digest "$bundle_digest" \
            --expected-runtime-tree-digest "$runtime_digest" \
            --expected-interpreter-closure-digest "$interpreter_digest" \
            --expected-deployment-instance-digest \
              aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --expected-host-identity-digest \
              bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --expected-activation-sequence-number 1 \
            --expected-activation-authority-id ci-runtime-activation \
            --expected-activation-authority-trust-store-digest \
              cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc

      - name: Upload the non-deployable candidate-smoke bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advar-linux-cpu-candidate-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/advar-linux-cpu-candidate-smoke
            ${{ runner.temp }}/runtime-activation-receipt.json
          if-no-files-found: error
          retention-days: 30
